services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: orquestacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-app_owner_dev_password}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-app_login_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - orquestacion_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../packages/db/sql:/bootstrap-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orquestacion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orquestacion_postgres_data:
